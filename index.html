<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Template</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>

<aside class="sidebar" id="sidebar">
<div class="sidebar-header">
<span class="logo">📊 Dash</span>
</div>
<nav class="sidebar-nav">
<a href="#" class="nav-link active">🏠 Overview</a>
<a href="#" class="nav-link">📈 Analytics</a>
<a href="#" class="nav-link">👥 Customers</a>
<a href="#" class="nav-link">📦 Orders</a>
<a href="#" class="nav-link">⚙️ Settings</a>
</nav>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
<header class="topbar">
<h1>Overview</h1>
<div class="topbar-right">
<input type="search" placeholder="Search..." class="search-input">
<div class="avatar">LJ</div>
</div>
</header>

<section class="stats-grid">
<div class="stat-card">
<div class="stat-icon">💰</div>
<div class="stat-body">
<span class="stat-label">Revenue</span>
<span class="stat-value">$48,200</span>
<span class="stat-change positive">+12.4%</span>
</div>
</div>
<div class="stat-card success">
<div class="stat-icon">👥</div>
<div class="stat-body">
<span class="stat-label">Active Users</span>
<span class="stat-value">3,482</span>
<span class="stat-change positive">+5.1%</span>
</div>
</div>
<div class="stat-card warning">
<div class="stat-icon">📦</div>
<div class="stat-body">
<span class="stat-label">Orders</span>
<span class="stat-value">1,204</span>
<span class="stat-change negative">-2.3%</span>
</div>
</div>
<div class="stat-card danger">
<div class="stat-icon">📉</div>
<div class="stat-body">
<span class="stat-label">Conversion Rate</span>
<span class="stat-value">4.8%</span>
<span class="stat-change positive">+0.6%</span>
</div>
</div>
</section>

<section class="panels-row">
<div class="panel">
<h2>Sales Overview</h2>
<div class="chart-placeholder" id="chartPlaceholder"></div>
</div>
<div class="panel">
<h2>Traffic Sources</h2>
<ul class="legend-list" id="trafficList"></ul>
</div>
</section>

<section class="panel">
<h2>Recent Orders</h2>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Order</th>
<th>Customer</th>
<th>Status</th>
<th>Amount</th>
</tr>
</thead>
<tbody id="ordersBody"></tbody>
</table>
</div>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
